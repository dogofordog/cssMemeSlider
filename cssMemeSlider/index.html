<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Meme Slider</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="slider">
      <input
        type="radio"
        name="slide"
        id="slide-1"
        class="control-input"
        checked
      />
      <input type="radio" name="slide" id="slide-2" class="control-input" />
      <input type="radio" name="slide" id="slide-3" class="control-input" />
      <input type="radio" name="slide" id="slide-4" class="control-input" />

      <figure class="slide slide-1">
        <img src="img/1-image.jpg" alt="meme 1" />
      </figure>
      <figure class="slide slide-2">
        <img src="img/2-image.gif" alt="meme 2" />
      </figure>
      <figure class="slide slide-3">
        <img src="img/3-image.jpg" alt="meme 3" />
      </figure>
      <figure class="slide slide-4">
        <img src="img/4-image.jpg" alt="meme 4" />
      </figure>

      <div class="captions">
        <p class="caption caption-1">One hour later...</p>
        <p class="caption caption-2">When you fix one thing and break two.</p>
        <p class="caption caption-3">Once upon a time... display: none;</p>
        <p class="caption caption-4">I need it ❤</p>
      </div>

      <div class="controls">
        <label for="slide-1" class="control-label"></label>
        <label for="slide-2" class="control-label"></label>
        <label for="slide-3" class="control-label"></label>
        <label for="slide-4" class="control-label"></label>
      </div>
    </main>
  </body>
</html>
